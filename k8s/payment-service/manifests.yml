apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: cricheroes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: cricheroes/payment-service:latest
        ports:
        - containerPort: 3015
        envFrom:
        - configMapRef:
            name: payment-service-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: cricheroes
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3015
  type: ClusterIP
